<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>body{font:14px -apple-system,sans-serif;margin:14px;line-height:1.65}h2{font-size:19px}</style><h2>安装完成</h2><p>前往「应用程序」，打开「键盘小黑猫」。</p><p>要让小猫在其他应用中也能跟着你敲键，请在系统提示时允许「输入监控」。如果覆盖升级后敲键盘没有反应，请退出桌宠，在「隐私与安全性 → 输入监控」移除旧授权，再把「应用程序」里的新版加回并开启。重新打开桌宠即可测试键盘联动。</p></html>
