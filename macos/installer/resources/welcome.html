<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>body{font:14px -apple-system,sans-serif;margin:14px;line-height:1.65}h2{font-size:19px}</style><h2>键盘小黑猫</h2><p>让桌宠陪你握鼠标、敲键盘。首次打开时会显示经典黑猫和苹果妙控键鼠。点菜单栏爪印，在「角色样式」中可以选择四款小猫，或西装、发卡、红结、发带、圆镜、耳机、贝雷帽、棒球帽、组长和柴犬十位同事。</p><p>此安装包支持 macOS 11 及以上版本的 Apple 芯片和 Intel Mac。</p></html>
